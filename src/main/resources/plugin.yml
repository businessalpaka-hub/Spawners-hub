name: SellGUI
version: 1.0
main: de.user.sellgui.SellGUI
api-version: '1.21'
author: Jules
softdepend: [Vault]

commands:
  sell:
    description: Opens the sell GUI.
    usage: /sell
  sellreload:
    description: Reloads the SellGUI configuration.
    usage: /sellreload
    permission: sellgui.admin

permissions:
  sellgui.admin:
    description: "Allows reloading the SellGUI plugin."
    default: op
