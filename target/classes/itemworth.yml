# Item worth for the multiplier hoppers.
# The format is: <itemname> = price
# Item names should be all lowercase, with no spaces or underscores.
# This corresponds to Material.toString().toLowerCase().replace("_", "")
worth:
  rottenflesh: 0.5
  carrot: 1.0
  bone: 0.75
  arrow: 0.25
  string: 1.2
  spidereye: 1.5
  gunpowder: 2.0
  porkchop: 3.0
  leather: 2.5
  beef: 3.0
  feather: 1.0
  chicken: 2.0
